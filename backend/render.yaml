services:
  - type: web
    name: cap-dti-backend
    runtime: docker
    dockerfilePath: Dockerfile
    context: .
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: TESSERACT_PATH
        value: /usr/bin/tesseract
      - key: TESSERACT_LANGUAGE
        value: eng
      - key: TESSERACT_TIMEOUT_SECONDS
        value: 15
      - key: TESSERACT_PSM
        value: 11
      - key: TESSERACT_SHELF_TAG_PASS_TIMEOUT_SECONDS
        value: 3
      - key: TESSERACT_SHELF_TAG_PRIMARY_PSM
        value: 6
      - key: TESSERACT_SHELF_TAG_FALLBACK_PSM
        value: 11
      - key: TESSERACT_SHELF_TAG_MINIMUM_CONFIDENCE
        value: 30
