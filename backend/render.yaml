services:
  - type: web
    name: cap-dti-backend
    runtime: docker
    dockerfilePath: Dockerfile
    context: .
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: TESSERACT_PATH
        value: /usr/bin/tesseract
      - key: TESSERACT_LANGUAGE
        value: eng
      - key: TESSERACT_TIMEOUT_SECONDS
        value: 15
      - key: TESSERACT_PSM
        value: 11
      - key: TESSERACT_SHELF_TAG_PASS_TIMEOUT_SECONDS
        value: 3
      - key: TESSERACT_SHELF_TAG_PRIMARY_PSM
        value: 6
      - key: TESSERACT_SHELF_TAG_FALLBACK_PSM
        value: 11
      - key: TESSERACT_SHELF_TAG_MINIMUM_CONFIDENCE
        value: 30
      - key: RECEIPT_EXTRACTION_PROVIDER
        value: tesseract
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: RECEIPT_EVIDENCE_DRIVER
        value: s3
      - key: RECEIPT_EVIDENCE_BUCKET
        sync: false
      - key: RECEIPT_EVIDENCE_ENDPOINT
        sync: false
      - key: RECEIPT_EVIDENCE_ACCESS_KEY_ID
        sync: false
      - key: RECEIPT_EVIDENCE_SECRET_ACCESS_KEY
        sync: false
      - key: RECEIPT_EVIDENCE_REGION
        sync: false
      - key: RECEIPT_EVIDENCE_USE_PATH_STYLE
        value: true
      - key: LEGAL_DOCUMENTS_DRIVER
        value: s3
      - key: VENDOR_PWA_URL
        sync: false
