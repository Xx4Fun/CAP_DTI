  <text x="63" y="210.92" class="body regular">Dear Sir/Madam:</text>

  <text x="63" y="237.32" class="body regular">In connection with the price/supply monitoring conducted at your store by the Consumer</text>
  <text x="63" y="250.62" class="body regular">Protection Unit of the Department of Trade and Industry - Antique on </text>
  <text id="monitoringDate" x="418.58" y="250.62" class="body bold">_______________</text>
  <text x="514.50" y="250.62" class="body regular">,</text>
  <text x="63" y="263.82" class="body regular">we would like to bring your attention to the results of the said monitoring, particularly on</text>
  <text x="63" y="277.12" class="body regular">the following:</text>

  <!-- observation table -->
  <rect x="64.7" y="288.13" width="455.5" height="64.82" fill="none" stroke="#000" stroke-width="0.3"/>

  <text x="80.625" y="304.32" class="tableText bold">Commodity</text>
  <text x="216.75" y="304.32" class="tableText bold">BN</text>
  <text x="315.75" y="304.32" class="tableText bold">PC</text>
  <text x="401.08" y="304.32" class="tableText bold">Observation/s</text>
  <text id="observation" x="176.83" y="336.62" class="tableText regular">Prices are above the SRP (Please see attached file)</text>

  <text x="63" y="377.05" class="body regular">As the agency mandated to ensure the reasonableness of prices/availability of supply of</text>
  <text x="63" y="390.25" class="body italic">basic necessities and prime commodities,</text>
  <text x="297.65" y="390.25" class="body regular">the DTI would like to inquire about the</text>
  <text x="63" y="403.45" class="body regular">circumstances and factors which caused the occurrence of the above-enumerated</text>
  <text x="63" y="416.65" class="body regular">observations.</text>

  <text x="63" y="443.15" class="body regular">Please respond within three (3) working days from upon receipt of this letter and e-mail it</text>
  <text x="63" y="456.35" class="body regular"><tspan>at </tspan><tspan text-decoration="underline">r06.antique@dti.gov.ph</tspan><tspan>. Any information that you provide will be treated with utmost</tspan></text>
  <text x="63" y="469.55" class="body regular">confidentiality and will be used solely for relevant monitoring, assessment, and analysis</text>
  <text x="63" y="482.85" class="body regular">purposes.</text>

  <text x="63" y="509.25" class="body regular">Thank you for your cooperation.</text>

  <text id="signatoryName" x="63" y="558.65" class="body bold">NAME</text>
  <text id="signatoryPosition" x="63" y="571.95" class="body regular">Provincial Director</text>
