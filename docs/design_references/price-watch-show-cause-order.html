(function(){
  const NS = 'http://www.w3.org/2000/svg';
  const overlay = () => document.getElementById('pw-dynamic-overlay');
  const clear = () => { const g=overlay(); while(g && g.firstChild) g.removeChild(g.firstChild); };
  const rect = (x,y,w,h,fill='#fff') => {
    const e=document.createElementNS(NS,'rect');
    e.setAttribute('x',x); e.setAttribute('y',y); e.setAttribute('width',w); e.setAttribute('height',h); e.setAttribute('fill',fill);
    overlay().appendChild(e); return e;
  };
  const text = (x,y,value,opt={}) => {
    const e=document.createElementNS(NS,'text');
    e.setAttribute('x',x); e.setAttribute('y',y);
    e.setAttribute('font-family', opt.family || 'Arial, Arimo, Liberation Sans, Helvetica, sans-serif');
    e.setAttribute('font-size', opt.size || 10.5);
    e.setAttribute('font-weight', opt.bold ? '700' : '400');
    if(opt.italic) e.setAttribute('font-style','italic');
    if(opt.anchor) e.setAttribute('text-anchor',opt.anchor);
    if(opt.fill) e.setAttribute('fill',opt.fill);
    if(opt.underline) e.setAttribute('text-decoration','underline');
    e.textContent = value == null ? '' : String(value);
    overlay().appendChild(e); return e;
  };

  /**
   * Optional PRICE-WATCH binding hook.
   * The untouched document remains a pixel-faithful copy of the supplied template.
   * Call window.fillShowCauseOrder({...}) only when populating a generated SCO.
   */
  window.fillShowCauseOrder = function(data={}) {
    clear();

    if(data.idtsNo){
      rect(149.5,130.0,55,12);
      text(150.92,138.42,data.idtsNo,{size:8,italic:true});
    }

    if(data.establishmentName){
      rect(278.5,179.0,251,12.5);
      text(279.75,188.62,data.establishmentName,{bold:true});
    }

    const address = Array.isArray(data.addressLines) ? data.addressLines : (data.address ? [data.address] : []);
    if(address.length){
      rect(278.5,192.4,251,25);
      text(279.75,202.12,address[0] || '');
      if(address[1]) text(279.75,214.72,address[1]);
    }

    if(data.email){
      rect(278.5,229.9,251,12.5);
      text(279.75,239.52,data.email);
    }
    if(data.mobile){
      rect(278.5,242.4,251,12.5);
      text(279.75,252.02,data.mobile);
    }

    if(data.complainantName){
      rect(369.0,290.4,68,13);
      text(371.6,300.72,data.complainantName,{bold:true});
    }

    if(data.law){
      // Replace the source placeholder "Article(s) of the RA XXXX." while keeping the same two-line area.
      rect(432.7,338.4,105,26.3);
      rect(117.2,350.5,70,14.0);
      text(434.27,348.92,'Article(s) of the RA',{bold:true,underline:true});
      text(118.43,361.05,String(data.law).replace(/\.$/, '') + '.',{bold:true,underline:true});
    }

    if(data.issuedDate){
      rect(169.6,507.7,124,13.5);
      text(171.43,518.15,data.issuedDate,{bold:true,underline:true});
    }

    if(data.signatoryName){
      rect(394,555.2,121,14.5);
      text(454.5,566.35,data.signatoryName,{bold:true,anchor:'middle'});
    }
    if(data.signatoryOffice){
      rect(378,567.8,149,14.5);
      text(452.0,578.45,data.signatoryOffice,{anchor:'middle'});
    }

    if(data.received){
      rect(87.5,618.7,13,13);
      text(88.32,629.47,data.received.checked ? '(✓)' : '( )');
      if(data.received.name){ rect(176.4,619.0,118,12); text(177.0,628.7,data.received.name,{size:9.5}); }
      if(data.received.position){ rect(176.4,632.0,118,12); text(177.0,641.7,data.received.position,{size:9.5}); }
      if(data.received.date){ rect(175.7,645.3,119,12); text(176.3,655.0,data.received.date,{size:9.5}); }
    }

    if(data.refused){
      rect(298.3,618.7,13,13);
      text(299.15,629.47,data.refused.checked ? '(✓)' : '( )');
      if(data.refused.name){ rect(431.9,619.0,103,12); text(432.5,628.7,data.refused.name,{size:9.5}); }
      if(data.refused.position){ rect(431.9,632.0,103,12); text(432.5,641.7,data.refused.position,{size:9.5}); }
      if(data.refused.date){ rect(431.2,645.3,104,12); text(431.8,655.0,data.refused.date,{size:9.5}); }
    }
  };
  window.clearShowCauseOrder = clear;
})();
</script>

</body>
</html>
